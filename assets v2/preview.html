<!doctype html>
<html lang="sr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>eWarState — oprema V2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11191d;color:#e8e4d9;font:15px system-ui,sans-serif}header{padding:25px 5vw;border-bottom:1px solid #34433e}h1{font-size:25px;letter-spacing:.08em;margin:0 0 7px}header p{margin:0;color:#aab8af}main{display:grid;grid-template-columns:minmax(330px,600px) minmax(320px,620px);gap:35px;padding:30px 5vw;justify-content:center}.portrait{position:sticky;top:24px;aspect-ratio:1;background:#293239;border:1px solid #46534c;align-self:start;overflow:hidden}.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.tools{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}button{background:#b6bd78;color:#17201a;border:0;padding:11px 17px;cursor:pointer;font-weight:700;border-radius:4px}button.secondary{background:#33453e;color:#e8e4d9}.row{padding:13px 0;border-top:1px solid #33433c}.row label{display:block;font-weight:600;margin-bottom:8px}.pickers{display:grid;grid-template-columns:1.1fr 1fr;gap:9px}select{background:#202e29;color:#e8e4d9;border:1px solid #495b50;padding:9px;min-width:0;border-radius:3px}.item-id{color:#b9c58e;font:12px ui-monospace,monospace;display:inline-block;margin-top:8px}small{color:#9caaa2}footer{padding:10px 5vw 30px;color:#9caaa2}a{color:#c4ce94}@media(max-width:800px){main{grid-template-columns:1fr}.portrait{position:relative;top:0}header{padding-top:18px}.pickers{grid-template-columns:1fr 1fr}}
</style>
<header><h1>eWarState / OPREMA V2</h1><p>171 model · 918 varijanti · pregled na osnovnom komandiru</p></header>
<main><div class="portrait" id="portrait" aria-label="Komandir sa odabranom opremom"></div><section><div class="tools"><button id="random">Nasumičan komandir</button><button class="secondary" id="reset">Osnovni primer</button></div><div id="controls"></div><p><small>PNG svakog odabranog predmeta možeš otvoriti preko njegove oznake.</small></p></section></main>
<footer>eWarState · <a href="README.md">Spisak sadržaja i korišćenje</a> · <a href="previews/commanders_1.jpg">Pregled kombinacija</a></footer>
<script src="catalog.js"></script>
<script>
const slots=[['background','Pozadina',['background']],['uniform','Odelo',['uniform']],['vest','Pancir / oprema preko odela',['vest']],['headgear','Kapa / šlem / kapuljača',['helmet','cap','beret','hat','hood']],['facewear','Maska / fantomka / marama',['mask','balaclava','scarf','gasmask']],['eyes','Naočare / povez',['glasses','eyepatch']],['ears','Slušalice',['headset']],['mouth','Cigara / cigareta',['cigar','cigarette']],['rank','Čin',['rank']],['paint','Boja za lice',['facepaint']],['scar','Ožiljak',['scar']]];
const state={};const controls=document.getElementById('controls');const modelMap=new Map(MODELS.map(m=>[m.id,m]));
for(const [key,title,types] of slots){const row=document.createElement('div');row.className='row';const label=document.createElement('label');label.textContent=title;label.htmlFor=key+'-model';row.append(label);const div=document.createElement('div');div.className='pickers';const models=document.createElement('select');models.id=key+'-model';const empty=document.createElement('option');empty.value='';empty.textContent='Bez dodatka';models.append(empty);for(const m of MODELS.filter(m=>types.includes(m.type)).sort((a,b)=>a.type.localeCompare(b.type)||Number(a.id.split('_').pop())-Number(b.id.split('_').pop()))){const o=document.createElement('option');o.value=m.id;o.textContent=m.id+' — '+m.name;models.append(o)}const colors=document.createElement('select');colors.id=key+'-color';colors.setAttribute('aria-label','Boja: '+title);div.append(models,colors);row.append(div);const link=document.createElement('a');link.className='item-id';link.id=key+'-link';row.append(link);controls.append(row);models.onchange=()=>{state[key]=models.value?modelMap.get(models.value).variants[0].id:null;resolve(key);render()};colors.onchange=()=>{state[key]=colors.value;render()}}
function selected(key){const id=state[key];return id?modelMap.get(id.substring(0,id.lastIndexOf('_'))):null}
function resolve(changed){const h=selected('headgear'),f=selected('facewear');if(h&&['helmet_19','helmet_20','helmet_21'].includes(h.id)){if(['facewear','eyes','ears','mouth'].includes(changed))state.headgear=null;else for(const s of ['facewear','eyes','ears','mouth'])state[s]=null}if(f&&(f.id==='mask_5'||f.type==='gasmask'&&Number(f.id.split('_')[1])>=4)){state.eyes=null;state.mouth=null}if(f&&f.type==='gasmask')state.ears=null;const coveredEars=['helmet_6','helmet_7','helmet_8','helmet_11','helmet_12','helmet_13','helmet_16','helmet_17','helmet_18','cap_5','cap_6','cap_7','cap_9','hat_6','hat_7'];if(h&&(coveredEars.includes(h.id)||h.type==='hood')){if(changed==='ears')state.headgear=null;else state.ears=null}}
function render(){for(const [key] of slots){const m=selected(key),ms=document.getElementById(key+'-model'),cs=document.getElementById(key+'-color'),link=document.getElementById(key+'-link');ms.value=m?.id||'';cs.replaceChildren();if(m)for(const v of m.variants){const o=document.createElement('option');o.value=v.id;o.textContent=v.id.split('_').pop()+' · '+v.label;cs.append(o)}cs.value=state[key]||'';cs.disabled=!m;const v=m?.variants.find(v=>v.id===state[key]);link.textContent=v?.id||'';if(v){link.href=v.file;link.target='_blank'}else link.removeAttribute('href')}
 const p=document.getElementById('portrait');p.replaceChildren();const add=(src,alt)=>{const im=document.createElement('img');im.src=src;im.alt=alt;p.append(im)};const draw=key=>{const m=selected(key),v=m?.variants.find(v=>v.id===state[key]);if(v)add(v.file,v.id)};draw('background');add('reference/head.png','Osnovna glava komandira');for(const s of ['paint','scar','uniform','vest','rank','facewear','headgear','eyes','ears','mouth'])draw(s)}
function applyExample(n,randomColors=false){for(const [key] of slots)state[key]=null;for(const id of EXAMPLES[n]){const m=modelMap.get(id.substring(0,id.lastIndexOf('_')));const key=slots.find(s=>s[2].includes(m.type))[0];state[key]=randomColors?m.variants[Math.floor(Math.random()*m.variants.length)].id:id}render()}
document.getElementById('random').onclick=()=>applyExample(Math.floor(Math.random()*EXAMPLES.length),true);document.getElementById('reset').onclick=()=>applyExample(0);applyExample(0);
</script></html>
